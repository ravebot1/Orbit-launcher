name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Auto Extract ZIP Files
        run: |
          for f in *.zip; do
            if [ -f "$f" ]; then
              echo "Extracting $f..."
              unzip -o "$f"
            fi
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34'

      - name: Generate Gradle Wrapper & Build
        run: |
          cd Orbit-launcher* || cd orbit-launcher* || true
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew || true
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/app-debug.apk'

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: '**/build/outputs/apk/debug/app-debug.apk'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
